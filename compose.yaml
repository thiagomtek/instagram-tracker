x-tracker-common: &tracker-common
  build: .
  restart: unless-stopped
  init: true
  environment: &tracker-environment
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
    INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    DATA_DIR: /app/data
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    SESSION_DAYS: ${SESSION_DAYS:-3650}
    TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
    LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
    GOOGLE_DRIVE_SETTLE_SECONDS: ${GOOGLE_DRIVE_SETTLE_SECONDS:-300}
    GOOGLE_DRIVE_MAX_ITEMS: ${GOOGLE_DRIVE_MAX_ITEMS:-10000}
    GOOGLE_DRIVE_DELETE_MODE: ${GOOGLE_DRIVE_DELETE_MODE:-trash}
    IMPORT_MASS_DROP_RATIO: ${IMPORT_MASS_DROP_RATIO:-0.3}
    IMPORT_MASS_DROP_MIN: ${IMPORT_MASS_DROP_MIN:-20}
    IMPORT_DUPLICATE_WINDOW_HOURS: ${IMPORT_DUPLICATE_WINDOW_HOURS:-12}
    PROFILE_VALIDATION_ENABLED: ${PROFILE_VALIDATION_ENABLED:-true}
    PROFILE_SCAN_ALL_ENABLED: ${PROFILE_SCAN_ALL_ENABLED:-true}
    PROFILE_VALIDATION_MAX_ATTEMPTS: ${PROFILE_VALIDATION_MAX_ATTEMPTS:-3}
    PROFILE_VALIDATION_STALE_SECONDS: ${PROFILE_VALIDATION_STALE_SECONDS:-900}
    PROFILE_VALIDATION_IDENTITY_ROTATIONS: ${PROFILE_VALIDATION_IDENTITY_ROTATIONS:-3}
    PROFILE_VALIDATION_BLOCK_COOLDOWN_SECONDS: ${PROFILE_VALIDATION_BLOCK_COOLDOWN_SECONDS:-300}
    PROFILE_VALIDATION_BLOCK_COOLDOWN_MAX_SECONDS: ${PROFILE_VALIDATION_BLOCK_COOLDOWN_MAX_SECONDS:-3600}
    PROFILE_VALIDATION_MIN_INTERVAL_SECONDS: ${PROFILE_VALIDATION_MIN_INTERVAL_SECONDS:-12}
    PROFILE_VALIDATION_MAX_INTERVAL_SECONDS: ${PROFILE_VALIDATION_MAX_INTERVAL_SECONDS:-30}
    PROFILE_VALIDATION_VPN_AVOID_SECONDS: ${PROFILE_VALIDATION_VPN_AVOID_SECONDS:-1800}
    PROFILE_VALIDATION_PROXY: ${PROFILE_VALIDATION_PROXY-http://vpn:8888}
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
    PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
    PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
    PWA_ID: ${PWA_ID:-/instagram-tracker-pwa}
    # The timezone comes only from these variables; no host files are mounted.
    TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
  volumes:
    - tracker-data:/app/data

services:
  instagram-tracker:
    <<: *tracker-common
    container_name: instagram-tracker
    ports:
      - "${APP_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  instagram-tracker-worker:
    <<: *tracker-common
    container_name: instagram-tracker-worker
    command: ["python", "worker.py"]
    depends_on:
      instagram-tracker:
        condition: service_healthy
    healthcheck:
      # The worker touches this file every loop; a stuck worker stops updating it.
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker-heartbeat') < 900 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  # WireGuard client that exposes an HTTP proxy for the worker's Instagram
  # requests only. The tunnel config is mounted from ./vpn (never committed).
  # If it fails the worker falls back to the direct network, unless the user
  # turned that off in the interface.
  vpn:
    image: qmcgaw/gluetun:v3.40.0
    container_name: instagram-tracker-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      HTTPPROXY: "on"
      HTTPPROXY_LOG: "off"
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    entrypoint: ["/bin/sh", "/vpn-entrypoint.sh"]
    volumes:
      - ./vpn/credentials.conf:/vpn/credentials.conf:ro
      - ./vpn-entrypoint.sh:/vpn-entrypoint.sh:ro

volumes:
  tracker-data:
