{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 76vh;">
    <div class="col-sm-10 col-md-7 col-lg-5">
        <div class="glass-card">
            <div class="text-center mb-4">
                <div class="login-icon">✨</div>
                <h1 class="mb-2 brand-text">Criar conta</h1>
                <p class="text-secondary mb-0">Use um e-mail e uma senha de pelo menos 12 caracteres.</p>
            </div>
            <form method="POST" action="{{ url_for('register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control auth-input" id="email" name="email" autocomplete="email" required autofocus value="{{ request.form.get('email', '') }}">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-group">
                        <input type="password" class="form-control auth-input" id="password" name="password" autocomplete="new-password" minlength="12" required>
                        <button class="btn btn-outline-light password-toggle" type="button" data-password-toggle="password" aria-label="Mostrar senha">Mostrar</button>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password_confirmation" class="form-label">Confirmar senha</label>
                    <input type="password" class="form-control auth-input" id="password_confirmation" name="password_confirmation" autocomplete="new-password" minlength="12" required>
                </div>
                <button type="submit" class="btn btn-insta w-100 py-3">Criar conta</button>
            </form>
            <p class="text-center text-secondary small mt-4 mb-0">
                Já tem uma conta? <a class="auth-link" href="{{ url_for('login') }}">Entrar</a>
            </p>
        </div>
    </div>
</div>
<script>
document.querySelectorAll('[data-password-toggle]').forEach((button) => {
    button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.passwordToggle);
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        button.textContent = isHidden ? 'Ocultar' : 'Mostrar';
        button.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Mostrar senha');
    });
});
</script>
{% endblock %}
