{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 76vh;">
    <div class="col-sm-10 col-md-7 col-lg-5">
        <div class="glass-card">
            <div class="text-center mb-4">
                <div class="login-icon">🔒</div>
                <h1 class="mb-2 brand-text">Instagram Hub</h1>
                <p class="text-secondary mb-0">Entre para acessar seu painel.</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control auth-input" id="email" name="email" autocomplete="email" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-group">
                        <input type="password" class="form-control auth-input" id="password" name="password" autocomplete="current-password" required>
                        <button class="btn btn-outline-light password-toggle" type="button" data-password-toggle="password" aria-label="Mostrar senha">Mostrar</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-insta w-100 py-3">Entrar</button>
            </form>
            {% if config.ALLOW_REGISTRATION %}
            <p class="text-center text-secondary small mt-4 mb-0">
                Ainda não tem acesso? <a class="auth-link" href="{{ url_for('register') }}">Criar conta</a>
            </p>
            {% endif %}
        </div>
    </div>
</div>
<script>
document.querySelectorAll('[data-password-toggle]').forEach((button) => {
    button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.passwordToggle);
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        button.textContent = isHidden ? 'Ocultar' : 'Mostrar';
        button.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Mostrar senha');
    });
});
</script>
{% endblock %}
